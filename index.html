<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>

  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/calendar.css">

  <script src="js/events.js" defer></script>
  <script src="js/calendar.js" defer></script>
</head>
<body>
  <main class="calendar glass">
    <header class="calendar__header">
      <h1 class="calendar__title" id="month-title" aria-live="polite"></h1>

      <div class="calendar__controls">
        <button class="button button--icon" id="previous-month" type="button"
                aria-label="Previous month">&#8592;</button>
        <button class="button" id="today" type="button">Today</button>
        <button class="button button--icon" id="next-month" type="button"
                aria-label="Next month">&#8594;</button>
      </div>
    </header>

    <div class="calendar__weekdays" id="weekdays" aria-hidden="true"></div>
    <div class="calendar__grid" id="calendar-grid"></div>
  </main>

  <dialog class="glass glass--strong panel" id="event-panel">
    <form id="event-form">
      <h2 class="panel__title" id="event-panel-title">New event</h2>
      <p class="panel__subtitle" id="event-panel-day"></p>

      <div class="panel__fields">
        <div class="field">
          <label class="field__label" for="event-title">Title</label>
          <input class="field__input" id="event-title" name="title" type="text"
                 placeholder="Dentist" autocomplete="off"
                 aria-describedby="event-title-error">
          <p class="field__error" id="event-title-error" hidden></p>
        </div>

        <div class="field">
          <label class="field__label" for="event-time">Time</label>
          <input class="field__input" id="event-time" name="time" type="time" value="09:00">
        </div>
      </div>

      <div class="panel__actions" id="event-actions">
        <button class="button button--danger" id="event-delete" type="button" hidden>Delete</button>
        <span class="panel__actions-spacer"></span>
        <button class="button" id="event-cancel" type="button">Cancel</button>
        <button class="button button--primary" type="submit">Save</button>
      </div>

      <div class="panel__confirm" id="event-delete-confirm" hidden>
        <p class="panel__confirm-question">Delete this event?</p>
        <div class="panel__actions">
          <span class="panel__actions-spacer"></span>
          <button class="button" id="event-delete-keep" type="button">Keep it</button>
          <button class="button button--danger" id="event-delete-really" type="button">Delete</button>
        </div>
      </div>
    </form>
  </dialog>
</body>
</html>
